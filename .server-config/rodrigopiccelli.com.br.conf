server {
    root /var/www/rodrigopiccelli.com;
    index index.html index.htm index.nginx-debian.html;
    server_name rodrigopiccelli.com.br;

    # Link headers para agent discovery (RFC 8288)
    add_header Link "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp/server-card.json>; rel=\"mcp-server-card\", </.well-known/oauth-authorization-server>; rel=\"service-meta\", </.well-known/oauth-protected-resource>; rel=\"service-meta\", </robots.txt>; rel=\"robots\", </sitemap.xml>; rel=\"sitemap\", </auth.md>; rel=\"service-doc\"" always;

    # Configuração de .well-known
    location /.well-known/ {
        # API Catalog com Content-Type correto
        location = /.well-known/api-catalog {
            default_type "application/linkset+json";
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri $uri/ =404;
        }

        # Agent Skills Index
        location = /.well-known/agent-skills/index.json {
            default_type "application/json";
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri $uri/ =404;
        }

        # MCP Server Card
        location = /.well-known/mcp/server-card.json {
            default_type "application/json";

            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri $uri/ =404;
        }

        # OAuth Authorization Server
        location = /.well-known/oauth-authorization-server {
            default_type "application/json";
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        # OAuth Protected Resource
        location = /.well-known/oauth-protected-resource {
            default_type "application/json";
            add_header Cache-Control "public, max-age=3600" always;
            return 200 '{"resource":"https://$host/","authorization_servers":["https://rodrigopiccelli.com"],"scopes_supported":["profile:read"],"bearer_methods_supported":["header"],"resource_documentation":"https://$host/auth.md"}';
        }

        # Padrão para .well-known
        try_files $uri $uri/ =404;
    }

    # Robots.txt
    location = /robots.txt {
        default_type "text/plain";
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Sitemap.xml
    location = /sitemap.xml {
        default_type "application/xml";
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Auth.md
    location = /auth.md {
        default_type "text/markdown";
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # WebMCP script
    location = /webmcp.js {
        default_type "application/javascript";
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Markdown negotiation for agents
    # If Accept header contains "text/markdown", try to serve .md version
    location = / {
        set $content_format "html";
        if ($http_accept ~* "text/markdown") {
            set $content_format "markdown";
        }
        
        if ($content_format = "markdown") {
            add_header Content-Type "text/markdown; charset=utf-8" always;
            add_header Vary "Accept" always;
            add_header Link "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp/server-card.json>; rel=\"mcp-server-card\", </.well-known/oauth-authorization-server>; rel=\"service-meta\", </.well-known/oauth-protected-resource>; rel=\"service-meta\", </robots.txt>; rel=\"robots\", </sitemap.xml>; rel=\"sitemap\", </auth.md>; rel=\"service-doc\"" always;
            rewrite ^/$ /index.md break;
        }
        
        try_files $uri /index.html =404;
        add_header Vary "Accept" always;
        add_header Link "</.well-known/agent-skills/index.json>; rel=\"agent-skills\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp/server-card.json>; rel=\"mcp-server-card\", </.well-known/oauth-authorization-server>; rel=\"service-meta\", </.well-known/oauth-protected-resource>; rel=\"service-meta\", </robots.txt>; rel=\"robots\", </sitemap.xml>; rel=\"sitemap\", </auth.md>; rel=\"service-doc\"" always;
    }

    # Serve .md files with correct Content-Type
    location ~ \.md$ {
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Vary "Accept" always;
        try_files $uri =404;
    }

    # Rotas padrão
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rodrigopiccelli.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rodrigopiccelli.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = rodrigopiccelli.com.br) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name rodrigopiccelli.com.br;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.rodrigopiccelli.com.br;
    return 301 https://rodrigopiccelli.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.rodrigopiccelli.com.br;
    ssl_certificate /etc/letsencrypt/live/rodrigopiccelli.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rodrigopiccelli.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://rodrigopiccelli.com.br$request_uri;
}
